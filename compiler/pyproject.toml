[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locateanything-compiler"
version = "1.0.5"
requires-python = ">=3.10"
dependencies = [
    "accelerate==1.12.0",
    "decord==0.6.0",
    "datasets==3.2.0",
    "lmdb==2.2.1",
    "numpy==2.2.6",
    "opencv-python-headless",
    "openpyxl==3.1.5",
    "packaging",
    "paramiko==3.5.1",
    "peft==0.12.0",
    "Pillow",
    "pyyaml==6.0.2",
    "requests",
    "tokenizers==0.22.2",
    "tqdm",
    "transformers==4.57.6",
]

# CUDA-enabled torch and torchvision must come from the OELLM/HBDK environment;
# installing generic PyPI wheels can replace the compiler-compatible builds.

[tool.setuptools]
include-package-data = true
py-modules = ["oellm_build"]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "pipeline*"]
