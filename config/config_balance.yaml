hobot_locateanything:
  ros__parameters:
    # Shared directory containing all model assets. Relative paths resolve
    # from the installed package runtime.
    model_directory: models

    # Directory containing the tokenizer files. Relative paths resolve from
    # the installed package runtime.
    tokenizer_directory: models/tokenizer

    # Vision HBM filename or absolute path. Relative filenames are resolved
    # against model_directory.
    vision_model: LocateAnything-3B_vision_balance.hbm

    # Language HBM filename or absolute path. Relative filenames are resolved
    # against model_directory.
    language_model: LocateAnything-3B_language_balance.hbm

    # FP16 token embedding table filename or absolute path. Relative filenames
    # are resolved against model_directory.
    embeddings: LocateAnything-3B_embed_tokens.bin

    # Select the decoder strategy: hybrid uses PBD with AR fallback, while
    # slow uses AR only.
    generation_mode: hybrid

    # Maximum response tokens generated for one request. The Language HBM
    # capacity remains authoritative.
    max_new_tokens: 640

    # IoU threshold used to suppress duplicate boxes with the same label.
    # The valid range is 0.0 to 1.0.
    nms_iou: 0.9

    # BPU core bit mask used by the Vision model.
    vision_backend_mask: 15

    # BPU core bit mask used by the Language model.
    language_backend_mask: 15

    # Per-core L2 cache allocation passed to the vendor runtime.
    l2m_sizes: "6:6:6:6"

    # Directory for annotated images and JSON results. Relative paths resolve
    # from the current working directory.
    output_directory: outputs

    # ROS image topic consumed by the inference node.
    input_topic: /hbmem_img

    # Use the TROS shared-memory image message when true, or sensor_msgs/Image
    # when false.
    is_shared_mem_sub: true

    # ROS topic used to update the active LocateAnything prompt.
    prompt_topic: /locateanything/prompt

    # ROS topic used to publish ai_msgs/PerceptionTargets inference results.
    result_topic: /perception/locateanything

# Configure the WebSocket bridge started by the main launch file. Its smart
# result topic follows hobot_locateanything.result_topic above.
websocket:
  ros__parameters:
    # ROS image topic forwarded by the WebSocket bridge.
    image_topic: /image

    # Image encoding published to WebSocket clients.
    image_type: mjpeg

    # Publish only the image stream when true, or include smart results when
    # false.
    only_show_image: false

    # Limit the WebSocket output frame rate; 0 disables rate limiting.
    output_fps: 0

    # WebSocket stream channel index.
    channel: 0

    # WebSocket bridge log level.
    log_level: warn
