[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oe-locateanything"
version = "0.5.0"
description = "Evidence-driven LocateAnything-3B deployment and validation on D-Robotics S600"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "oe_locateanything contributors" }]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
runtime = [
    "numpy>=1.24",
    "Pillow>=9.5",
    "tokenizers>=0.15",
]
report = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "Pillow>=9.5",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "compiler", "src"]
addopts = "-ra"

[tool.oe-locateanything]
compiler-package-root = "compiler"
compiler-scripts-root = "compiler/scripts"
deploy-root = "deploy"
artifacts-root = "artifacts"
calibration-root = "artifacts/calibration"
build-root = "artifacts/builds"
evaluation-root = "artifacts/evaluation"
release-root = "artifacts/releases"
run-root = "artifacts/runs"
