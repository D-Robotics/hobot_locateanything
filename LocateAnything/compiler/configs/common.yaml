schema_version: 1

paths:
  model: models/LocateAnything-3B
  upstream_source: datasets/upstream/Eagle/Embodied
  selected_jsonl: datasets/calibration/locateanything/source/selected.jsonl
  generated_dir: outputs/calibration/locateanything/generated
  generated_jsonl: outputs/calibration/locateanything/generated/generated.jsonl

model:
  image_width: 672
  image_height: 672
  resize_mode: letterbox
  letterbox_fill: 128
  patch_size: 14
  spatial_merge: 2
  hidden_size: 2048
  vocab_size: 152681

calibration:
  sample_count: auto
  checkpoint_samples: auto
  device: cuda:0
  prepare_dtype: bfloat16
  calibrate_dtype: float16
  slow_samples: 128
  max_new_tokens: 1024
  seed: 20260729
  image_token_id: 151665
  hidden_rotation_path: null

language:
  chunk_size: 1024
  cache_len: 4096
  pbd_query_len: 6
  ar_query_len: 1
  decoder_w_bits: 8
  lm_head_w_bits: 8
  ar_wv_matmul_dtype: int8

vision:
  w_bits: 8

build:
  march: nash-p
  jobs: 16
  device: cuda:0
  conda_env: oellm_clean
  python: python3
  bash: bash
  cores:
    vision: 4
    prefill: 4
    pbd: 4
    ar: 4
